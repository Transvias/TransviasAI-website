name: CI/CD

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      N8N_EC2_REGION: ${{ vars.N8N_EC2_REGION }}
      N8N_STACK_NAME: ${{ vars.N8N_STACK_NAME }}
      N8N_HOSTED_ZONE_ID: ${{ vars.N8N_HOSTED_ZONE_ID }}
      DEPLOY_S3_BUCKET: ${{ vars.DEPLOY_S3_BUCKET }}
      VIA_DOMAIN_NAME: via.transvias.com.br
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      LEAD_EMAIL_TO: ${{ secrets.LEAD_EMAIL_TO }}
      LEAD_EMAIL_FROM: ${{ secrets.LEAD_EMAIL_FROM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy ViA
        run: bash scripts/deploy-via-ec2.sh
